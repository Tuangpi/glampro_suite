name: Production deploy or rollback
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable release to deploy, e.g. v1.0.0"
        required: true
        type: string
      operation:
        description: "Deploy a new release or restore a previously healthy release"
        required: true
        type: choice
        options: [deploy, rollback]
      schema_compatible:
        description: "I verified this release and the previous release work with the current database schema"
        required: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      VERSION: ${{ inputs.version }}
      OPERATION: ${{ inputs.operation }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - name: Validate request
        env:
          SCHEMA_COMPATIBLE: ${{ inputs.schema_compatible }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$OPERATION" == deploy || "$OPERATION" == rollback ]]
          [[ "$SCHEMA_COMPATIBLE" == true ]]
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$VPS_PORT" =~ ^[0-9]+$ ]]
      - name: Download published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir bundle
          gh release download "$VERSION" --pattern 'release.tar.gz*'
          sha256sum --check release.tar.gz.sha256
          tar -xzf release.tar.gz -C bundle
      - name: Configure verified SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload release and deploy
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/glampro/incoming/$VERSION"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$VPS_PORT" bundle/* "$VPS_USER@$VPS_HOST:/opt/glampro/incoming/$VERSION/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash /opt/glampro/incoming/$VERSION/release.sh $OPERATION $VERSION schema-compatible"
      - name: Verify public HTTPS path
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          [[ "$PRODUCTION_URL" == https://* ]]
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 15 "${PRODUCTION_URL%/}/api/health"
          curl --fail --silent --show-error --max-time 15 "${PRODUCTION_URL%/}/" > /dev/null
      - name: Remove ephemeral SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
