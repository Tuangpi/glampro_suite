name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require stable version and master ancestry
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/master
  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
  package:
    needs: ci
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci
      - name: Build the exact release contents
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npm run build
      - name: Package compiled application and locked dependencies
        env:
          VERSION: ${{ github.ref_name }}
        run: bash deploy/package-release.sh "$VERSION"
      - name: Scan complete release dependencies and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: bundle
          trivyignores: .github/trivy-release.trivyignore.yaml
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - name: Malware scan of release contents
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --recursive --infected --max-filesize=100M --max-scansize=500M --alert-exceeds-max=yes bundle
      - name: Create release archive
        run: |
          tar -czf release.tar.gz -C bundle .
          sha256sum release.tar.gz > release.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-release
          path: |
            release.tar.gz
            release.tar.gz.sha256
          retention-days: 14
  publish:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-release
      - name: Publish scanned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" release.tar.gz release.tar.gz.sha256 --verify-tag --generate-notes --title "$VERSION"
