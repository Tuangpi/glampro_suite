name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require stable version and main ancestry
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/main
  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
  images:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [api, web, migrator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ github.ref_name }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}-$COMPONENT:$VERSION" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.component == 'web' && 'web' || 'api' }}/Dockerfile
          target: ${{ matrix.component == 'migrator' && 'migrator' || 'runtime' }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
      - name: Scan image vulnerabilities, secrets and image configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - name: Malware scan of complete release filesystem
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          mkdir /tmp/release-root
          container=$(docker create "$IMAGE")
          docker export "$container" | tar -xf - -C /tmp/release-root
          docker rm "$container"
          clamscan --recursive --infected --max-filesize=100M --max-scansize=500M --alert-exceeds-max=yes /tmp/release-root
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned image and record immutable digest
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          docker push "$IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          printf '%s_IMAGE=%s\n' "${COMPONENT^^}" "$digest" > "$COMPONENT.env"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.component }}
          path: ${{ matrix.component }}.env
          retention-days: 14
  publish:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Publish release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir bundle
          cat digests/api.env digests/web.env digests/migrator.env > bundle/images.env
          cp deploy/compose.production.yml deploy/release.sh bundle/
          tar -czf release.tar.gz -C bundle .
          sha256sum release.tar.gz > release.tar.gz.sha256
          gh release create "$VERSION" release.tar.gz release.tar.gz.sha256 --verify-tag --generate-notes --title "$VERSION"
