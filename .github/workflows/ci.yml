name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Only superseded PR runs share a group; master/manual/release runs stay independent.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: glampro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d glampro_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci-disposable-only@127.0.0.1:5432/glampro_test
      TEST_DATABASE_URL: postgresql://ci:ci-disposable-only@127.0.0.1:5432/glampro_test
      JWT_SECRET: ci-only-not-a-production-secret-at-least-48-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit
      - run: npm run db:migrate
      # Compiling shared/API checks their types; the web build includes its typecheck.
      - run: npm run verify:ci
      - name: Deployment script regression tests
        run: bash deploy/test-release.sh
  security:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      # Keep scanner downloads outside the repository and its malware scan scope.
      PIP_CACHE_DIR: ${{ runner.temp }}/semgrep-pip-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high
      - name: Cache Semgrep downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-pip-semgrep-1.184.0-v1
      - name: Static security analysis
        run: |
          python3 -m venv /tmp/semgrep
          /tmp/semgrep/bin/pip install semgrep==1.184.0
          /tmp/semgrep/bin/semgrep scan --config .github/semgrep.yml --error --strict apps/api/src apps/web/src packages/shared/src
      - name: Source vulnerabilities, secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - name: Install antivirus and refresh signatures
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - name: Scan source and dependencies before install scripts execute
        run: |
          npm ci --ignore-scripts --no-audit
          # Trivy's generated vulnerability database is scanner data, not source or dependencies.
          clamscan --recursive --infected --max-filesize=100M --max-scansize=500M --alert-exceeds-max=yes --exclude-dir='^\./\.git(/|$)' --exclude-dir='^\./\.cache/trivy(/|$)' .
